services:

  database:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: optiradar
      POSTGRES_USER: optiradar
      POSTGRES_PASSWORD: optiradar
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - /opt/optiradar/data:/var/lib/postgresql/data

  optiradar:
    # Image built from docker/Dockerfile.* (the stock traccar/traccar image has no OptiNexus integration)
    image: ghcr.io/gsiddik/optiradar:latest
    restart: unless-stopped
    depends_on:
      - database
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/optiradar
      DATABASE_USER: optiradar
      DATABASE_PASSWORD: optiradar
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8082/api/health" ]
      interval: 2m
      timeout: 5s
      start_period: 1h
      retries: 3
    ports:
      - "8082:8082"
      - "5000-5500:5000-5500"
    volumes:
      - /opt/optiradar/logs:/opt/optiradar/logs

  autoheal:
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 3600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
