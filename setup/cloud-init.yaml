#cloud-config

# Replace CHANGE-version with an OptiRadar release version (installer optiradar-linux-64-<version>.zip).

write_files:
  - content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE properties SYSTEM 'http://java.sun.com/dtd/properties.dtd'>
      <properties>
        <entry key='database.driver'>com.mysql.jdbc.Driver</entry>
        <entry key='database.url'>jdbc:mysql://localhost/optiradar?zeroDateTimeBehavior=round&amp;serverTimezone=UTC&amp;allowPublicKeyRetrieval=true&amp;useSSL=false&amp;allowMultiQueries=true&amp;autoReconnect=true&amp;useUnicode=yes&amp;characterEncoding=UTF-8&amp;sessionVariables=sql_mode=''</entry>
        <entry key='database.user'>root</entry>
        <entry key='database.password'>root</entry>
      </properties>
    path: /root/optiradar.xml

package_update: true
packages:
  - unzip
  - mysql-server

runcmd:
  - mysql -u root --execute="ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; GRANT ALL ON *.* TO 'root'@'localhost' WITH GRANT OPTION; FLUSH PRIVILEGES; CREATE DATABASE optiradar;"
  - wget https://github.com/gsiddik/OptiRadar/releases/download/vCHANGE-version/optiradar-linux-64-CHANGE-version.zip
  - unzip optiradar-linux-*.zip && ./optiradar.run
  - cp /root/optiradar.xml /opt/optiradar/conf/
  - service optiradar start
